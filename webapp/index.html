<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Dota Match Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Макет: шапка игрока + липкие вкладки, под ними одна колонка карточек; матч открывается поверх экраном. */
:root {
  --bg: #0e1218;        /* ночь карты */
  --surface: #161c25;
  --surface-2: #1e2631;
  --line: #2a3442;
  --fg: #e9edf3;
  --muted: #8d98aa;
  --gold: #e3b04b;      /* золото Dota — акцент */
  --win: #6cc072;       /* Силы Света */
  --loss: #e25b4c;      /* Силы Тьмы */
  --on-gold: #1a1407;
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f3f6; --surface: #ffffff; --surface-2: #eceff4; --line: #d9dee6;
    --fg: #141a23; --muted: #5b6676; --gold: #a8740c; --win: #2e8a3a; --loss: #c23a2c; --on-gold: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f3f6; --surface: #ffffff; --surface-2: #eceff4; --line: #d9dee6;
  --fg: #141a23; --muted: #5b6676; --gold: #a8740c; --win: #2e8a3a; --loss: #c23a2c; --on-gold: #ffffff;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 700; text-wrap: balance; }
h2 { font-size: 15px; letter-spacing: .02em; }
.muted { color: var(--muted); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

/* шапка игрока */
.hero-head { padding-block: 18px 14px; display: grid; gap: 14px; }
.who { display: flex; gap: 14px; align-items: center; }
.avatar {
  width: 58px; height: 58px; border-radius: 16px; flex: none;
  background: radial-gradient(circle at 30% 25%, color-mix(in oklab, var(--gold) 70%, var(--surface)), var(--surface-2));
  display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--on-gold);
  box-shadow: 0 0 0 2px var(--gold);
}
.who h1 { font-size: 20px; line-height: 1.15; }
.rank { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 13px; }
.medal { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--gold); }
.medal svg { width: 18px; height: 18px; }
.sample {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 8px;
}
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border-radius: 12px; padding: 10px 10px 9px; min-width: 0; }
.kpi b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.kpi span { font-size: 11px; color: var(--muted); }

/* вкладки */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tab {
  flex: none; background: none; border: 0; padding: 12px 12px 11px; cursor: pointer;
  color: var(--muted); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--gold); }

main { padding-block: 16px 40px; display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* результат */
.res { display: inline-grid; place-items: center; min-width: 42px; height: 22px; padding: 0 6px; border-radius: 6px;
  font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.res.w { background: color-mix(in oklab, var(--win) 22%, transparent); color: var(--win); }
.res.l { background: color-mix(in oklab, var(--loss) 22%, transparent); color: var(--loss); }
.strip { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; }
.strip i { height: 22px; border-radius: 4px; display: block; }
.strip .w { background: var(--win); } .strip .l { background: var(--loss); }

/* аватар героя (в приложении — портрет героя) */
.hico { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center;
  font-weight: 700; font-size: 12px; color: #fff; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.4); }

/* списки */
.list { display: grid; gap: 2px; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-radius: 10px; min-width: 0; }
button.row { width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
button.row:hover { background: var(--surface-2); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 12px; color: var(--muted); }
.row .end { text-align: right; flex: none; font-size: 13px; }

.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--gold); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--fg); background: color-mix(in oklab, var(--gold) 14%, transparent); }

/* графики */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font: 10px var(--font-body); }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%);
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.compare { display: grid; gap: 10px; }
.cmp-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13px; }
.cmp-track { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); }
.cmp-track i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--gold); }
.cmp-track b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; }
.delta-up { color: var(--win); } .delta-down { color: var(--loss); }

/* тепловая карта */
.heat { display: grid; grid-template-columns: 22px repeat(24, minmax(0, 1fr)); gap: 2px; font-size: 10px; color: var(--muted); }
.heat .c { aspect-ratio: 1; border-radius: 3px; max-width: 100%; }
.heat .h { text-align: center; }

/* экран матча */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-top { display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.back { background: var(--surface); border: 0; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
.score { display: flex; align-items: center; justify-content: center; gap: 14px; font-family: var(--font-display); font-size: 26px; }
.score .rad { color: var(--win); } .score .dire { color: var(--loss); }
.teams { display: grid; gap: 10px; }
.team-name { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; }
.picks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick { background: var(--surface-2); border-radius: 10px; padding: 8px 4px 7px; display: grid; justify-items: center; gap: 4px; min-width: 0; text-align: center; position: relative; }
.pick.me { box-shadow: 0 0 0 2px var(--gold); }
.pick .pos { position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 700; color: var(--muted); }
.pick .nm { font-size: 11px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 520px; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; }
th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
td:first-child, th:first-child { text-align: left; }
tr.me td { color: var(--gold); font-weight: 600; }
tbody tr + tr td { border-top: 1px solid var(--line); }
.team-sep td { padding-top: 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-top: 0 !important; }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<header class="wrap hero-head">
  <div class="who">
    <div class="avatar" aria-hidden="true">M</div>
    <div style="min-width:0">
      <h1 id="nick">Moseses</h1>
      <div class="rank">
        <span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 15.6 6.6 18.5l1.2-6L3.3 8.3l6.1-.7z"/></svg>Властелин III</span>
        <span class="muted">≈4 234 MMR</span>
        <span class="sample">пример данных</span>
      </div>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<nav class="tabs" aria-label="Разделы">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>

<main class="wrap" id="view" aria-live="polite"></main>

<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-label="Матч"></section>

<script>
/* ---------- пример данных (в приложении — OpenDota по Dota ID из бота) ---------- */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd() * a.length)];
const HEROES = [
  ["Anti-Mage", 1, 205], ["Juggernaut", 1, 12], ["Phantom Assassin", 1, 280], ["Faceless Void", 1, 265],
  ["Invoker", 2, 30], ["Storm Spirit", 2, 220], ["Shadow Fiend", 2, 350], ["Puck", 2, 300],
  ["Mars", 3, 15], ["Axe", 3, 5], ["Tidehunter", 3, 170],
  ["Earthshaker", 4, 40], ["Tusk", 4, 190], ["Rubick", 4, 120],
  ["Crystal Maiden", 5, 200], ["Lion", 5, 330], ["Witch Doctor", 5, 100], ["Shadow Shaman", 5, 60],
];
const myPool = [0, 1, 3, 4, 2, 0, 1, 3, 8, 0];   // любимые герои чаще
const NAMES = ["Kirill", "nekit", "Vlad_x", "Shadow", "Artem", "zxc ghoul", "Мишаня", "Leha", "MoonFang", "dendi fan"];
const FRIENDS = [
  { name: "Kirill", games: 14, wins: 10, last: 1 }, { name: "nekit", games: 9, wins: 4, last: 2 },
  { name: "Vlad_x", games: 6, wins: 4, last: 5 }, { name: "Artem", games: 4, wins: 1, last: 11 },
  { name: "Мишаня", games: 2, wins: 2, last: 24 },
];
const ITEMS = ["Battle Fury", "Manta Style", "Black King Bar", "Butterfly", "Abyssal Blade", "Satanic", "Skadi", "Daedalus"];
const NOW = Date.UTC(2026, 9, 18, 18, 0) / 1000;
const MATCHES = [];
for (let i = 0; i < 60; i++) {
  const h = HEROES[myPool[Math.floor(rnd() * myPool.length)]];
  const pos = h[1];
  const win = rnd() < (pos === 1 ? 0.6 : 0.5);
  const dur = Math.round(1500 + rnd() * 1500);
  const k = Math.round((pos <= 2 ? 6 : 2) + rnd() * (pos <= 2 ? 10 : 5));
  const d = Math.round(1 + rnd() * 8), a = Math.round(4 + rnd() * 14);
  const gpm = Math.round((pos === 1 ? 560 : pos === 2 ? 520 : pos === 3 ? 450 : 320) + (win ? 60 : -40) + rnd() * 120);
  const day = Math.floor(i * 0.5 + rnd() * 0.4);
  const hour = [19, 20, 21, 22, 23, 0, 18, 21, 22, 15][Math.floor(rnd() * 10)];
  const end = NOW - day * 86400 - ((18 - hour + 24) % 24) * 3600;
  MATCHES.push({ id: 8123456700 - i, hero: h[0], hue: h[2], pos, win, dur, k, d, a, gpm,
    xpm: Math.round(gpm * 1.1 + rnd() * 60), nw: Math.round(gpm * dur / 60), end, ranked: rnd() < 0.8 });
}

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const fmtK = v => Math.abs(v) >= 10000 ? (v / 1000).toFixed(1) + "k" : Math.round(v).toLocaleString("ru-RU");
const ago = ts => { const s = NOW - ts; if (s < 3600) return `${Math.max(1, s / 60 | 0)} мин назад`;
  if (s < 86400) return `${s / 3600 | 0} ч назад`; const d = s / 86400 | 0; return d === 1 ? "вчера" : `${d} дн назад`; };
const pct = (w, g) => g ? Math.round(w / g * 100) : 0;
const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c);
const POS = { 1: "Керри", 2: "Мидер", 3: "Хардлейнер", 4: "Саппорт 4", 5: "Саппорт 5" };
const hico = (name, hue, size = 36) =>
  `<span class="hico" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,hsl(${hue} 55% 42%),hsl(${(hue + 40) % 360} 50% 28%))" aria-hidden="true">${esc(name.split(/[\s-]/).map(w => w[0]).join("").slice(0, 2))}</span>`;
const res = w => `<span class="res ${w ? "w" : "l"}">${w ? "WIN" : "LOSS"}</span>`;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const wins = MATCHES.filter(m => m.win).length;
const avg = f => MATCHES.reduce((s, m) => s + f(m), 0) / MATCHES.length;

/* ---------- шапка ---------- */
$("#kpis").innerHTML = [
  [MATCHES.length, "матчей за месяц"], [pct(wins, MATCHES.length) + "%", "винрейт"],
  [avg(m => (m.k + m.a) / Math.max(1, m.d)).toFixed(1), "средний KDA"], [Math.round(avg(m => m.gpm)), "средний GPM"],
].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");

/* ---------- графики ---------- */
function tooltipFor(box) {
  let tip = box.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip); }
  return tip;
}

// винрейт по последним 10 играм, от старых к новым
function winrateChart() {
  const games = [...MATCHES].reverse();
  const pts = games.map((_, i) => { const s = games.slice(Math.max(0, i - 9), i + 1); return pct(s.filter(m => m.win).length, s.length); });
  const W = 360, H = 170, L = 30, R = 6, T = 8, B = 20;
  const x = i => L + i / (pts.length - 1) * (W - L - R), y = v => T + (100 - v) / 100 * (H - T - B);
  const line = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1)},${y(0)}L${x(0)},${y(0)}Z`;
  const grid = [0, 25, 50, 75, 100].map(v =>
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v === 50 ? 1.5 : 1}" ${v === 50 ? "" : 'stroke-dasharray="2 4"'}/>
     <text x="${L - 8}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`).join("");
  const last = pts.length - 1;
  return `<div class="chart" id="wr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Винрейт по последним 10 играм">
    <defs><linearGradient id="wrg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".28"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#wrg)"/><path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(pts[last])}" r="4.5" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H - 6}">60 игр назад</text><text x="${W - R}" y="${H - 6}" text-anchor="end">сейчас</text>
    <line id="wr-x" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle id="wr-dot" r="4" fill="var(--gold)" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" data-hit="1"/>
  </svg></div>`;
  // интерактив навешивается в bindWinrate
}
function bindWinrate() {
  const box = $("#wr"); if (!box) return;
  const games = [...MATCHES].reverse();
  const pts = games.map((_, i) => { const s = games.slice(Math.max(0, i - 9), i + 1); return pct(s.filter(m => m.win).length, s.length); });
  const svg = box.querySelector("svg"), tip = tooltipFor(box), W = 360, L = 30, R = 6, T = 8, B = 20, H = 170;
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((px - L) / (W - L - R) * (pts.length - 1))));
    const cx = L + i / (pts.length - 1) * (W - L - R), cy = T + (100 - pts[i]) / 100 * (H - T - B);
    svg.querySelector("#wr-x").setAttribute("x1", cx); svg.querySelector("#wr-x").setAttribute("x2", cx);
    svg.querySelector("#wr-x").setAttribute("visibility", "visible");
    const dot = svg.querySelector("#wr-dot"); dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");
    const g = games[i];
    tip.innerHTML = `<b>${pts[i]}%</b> за 10 игр<br><span class="muted">${esc(g.hero)} · ${g.win ? "победа" : "поражение"} · ${ago(g.end)}</span>`;
    tip.style.left = cx / W * r.width + "px"; tip.style.top = cy / H * r.height + "px"; tip.hidden = false;
  };
  const hit = svg.querySelector("[data-hit]");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; svg.querySelector("#wr-x").setAttribute("visibility", "hidden"); svg.querySelector("#wr-dot").setAttribute("visibility", "hidden"); });
}

function radar(vals, size = 240) {
  const axes = ["Фарм", "Драки", "Строения", "Лечение", "Саппортинг"];
  const c = size / 2, R = size * 0.32, max = Math.max(50, Math.ceil(Math.max(...vals) / 10) * 10);
  const pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / 5; return [c + R * v / max * Math.cos(a), c + R * v / max * Math.sin(a)]; };
  const ring = l => axes.map((_, i) => pt(i, max * l).join(",")).join(" ");
  const poly = vals.map((v, i) => pt(i, v).join(",")).join(" ");
  return `<div class="chart"><svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Вклад в игру">
    ${[.25, .5, .75, 1].map(l => `<polygon points="${ring(l)}" fill="none" stroke="var(--line)"/>`).join("")}
    ${axes.map((_, i) => `<line x1="${c}" y1="${c}" x2="${pt(i, max)[0]}" y2="${pt(i, max)[1]}" stroke="var(--line)"/>`).join("")}
    <polygon points="${poly}" fill="var(--gold)" fill-opacity=".25" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v, i) => { const [x, y] = pt(i, v); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--gold)"/>`; }).join("")}
    ${axes.map((n, i) => { const [x, y] = pt(i, max * 1.32); return `<text x="${x}" y="${y - 2}" text-anchor="middle" style="fill:var(--fg);font-weight:600;font-size:11px">${n}</text><text x="${x}" y="${y + 11}" text-anchor="middle" style="fill:var(--gold);font-weight:700">${Math.round(vals[i])}%</text>`; }).join("")}
  </svg></div>`;
}

// преимущество по золоту: выше нуля — Силы Света, ниже — Силы Тьмы
function goldChart(series) {
  const W = 360, H = 190, L = 36, R = 6, T = 8, B = 20, n = series.length - 1;
  const max = Math.max(2000, ...series.map(Math.abs)), lim = Math.ceil(max / 5000) * 5000;
  const x = i => L + i / n * (W - L - R), y = v => T + (lim - v) / (2 * lim) * (H - T - B);
  const line = series.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${line}L${x(n)},${y(0)}L${x(0)},${y(0)}Z`;
  const ticks = [-lim, -lim / 2, 0, lim / 2, lim];
  const mins = []; for (let m = 0; m <= n; m += 10) mins.push(m);
  return `<div class="chart" id="gold"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Преимущество по золоту">
    <defs>
      <clipPath id="above"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath>
      <clipPath id="below"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath>
    </defs>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v ? 'stroke-dasharray="2 4"' : 'stroke-width="1.5"'}/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v > 0 ? "+" : ""}${fmtK(v)}</text>`).join("")}
    ${mins.map(m => `<text x="${x(m)}" y="${H - 6}" text-anchor="middle">${m}'</text>`).join("")}
    <path d="${area}" fill="var(--win)" fill-opacity=".28" clip-path="url(#above)"/>
    <path d="${area}" fill="var(--loss)" fill-opacity=".28" clip-path="url(#below)"/>
    <path d="${line}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="${L + 6}" y="${T + 10}" style="fill:var(--win);font-weight:600">▲ Силы Света</text>
    <text x="${L + 6}" y="${H - B - 5}" style="fill:var(--loss);font-weight:600">▼ Силы Тьмы</text>
    <line id="g-x" y1="${T}" y2="${H - B}" stroke="var(--muted)" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" data-hit="1"/>
  </svg></div>`;
}
function bindGold(series) {
  const box = $("#gold"); if (!box) return;
  const svg = box.querySelector("svg"), tip = tooltipFor(box), W = 360, H = 190, L = 36, R = 6, T = 8, B = 20, n = series.length - 1;
  const lim = Math.ceil(Math.max(2000, ...series.map(Math.abs)) / 5000) * 5000;
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n, Math.round((px - L) / (W - L - R) * n)));
    const cx = L + i / n * (W - L - R), cy = T + (lim - series[i]) / (2 * lim) * (H - T - B);
    const gx = svg.querySelector("#g-x"); gx.setAttribute("x1", cx); gx.setAttribute("x2", cx); gx.setAttribute("visibility", "visible");
    const v = series[i];
    tip.innerHTML = `<b>${i}'</b> · ${v >= 0 ? "Свет" : "Тьма"} +${fmtK(Math.abs(v))} золота`;
    tip.style.left = cx / W * r.width + "px"; tip.style.top = cy / H * r.height + "px"; tip.hidden = false;
  };
  const hit = svg.querySelector("[data-hit]");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; svg.querySelector("#g-x").setAttribute("visibility", "hidden"); });
}

const state = { heroSort: "games" };

  const map = {};

/* ---------- экран матча ---------- */
function openMatch(id) {
  const m = MATCHES.find(x => x.id === id);
  seed = id % 100000 + 11;   // стабильные «случайные» детали для каждого матча
  const meRadiant = rnd() < 0.5, radiantWin = meRadiant === m.win;
  const others = HEROES.filter(h => h[0] !== m.hero).sort(() => rnd() - .5);
  const team = (radiant) => [1, 2, 3, 4, 5].map((p, i) => {
    const mine = radiant === meRadiant && p === m.pos;
    const h = mine ? HEROES.find(x => x[0] === m.hero) : (others.find(x => x[1] === p && !x.used) || others[0]);
    if (!mine) { h.used = true; }
    const core = p <= 3, won = radiant === radiantWin;
    const gpm = mine ? m.gpm : Math.round((core ? 500 : 300) + (won ? 50 : -30) + rnd() * 120);
    return { p, hero: h[0], hue: h[2], name: mine ? "Moseses" : NAMES[(i + (radiant ? 0 : 5)) % 10], me: mine,
      k: mine ? m.k : Math.round(rnd() * (core ? 14 : 6)), d: mine ? m.d : Math.round(1 + rnd() * 9), a: mine ? m.a : Math.round(3 + rnd() * 16),
      gpm, xpm: Math.round(gpm * 1.1 + rnd() * 50), nw: Math.round(gpm * m.dur / 60), dmg: Math.round((core ? 18000 : 7000) + rnd() * 16000) };
  });
  HEROES.forEach(h => delete h.used);
  const rad = team(true), dire = team(false);
  const rs = rad.reduce((s, p) => s + p.k, 0), ds = dire.reduce((s, p) => s + p.k, 0);
  const mins = Math.round(m.dur / 60); let g = 0; const gold = [0];
  for (let i = 1; i <= mins; i++) { g += (rnd() - .5) * 1800 + (radiantWin ? 1 : -1) * i * 18; gold.push(Math.round(g)); }
  const myTeam = meRadiant ? rad : dire, me = myTeam.find(p => p.me);
  const share = (f) => f(me) / myTeam.reduce((s, p) => s + f(p), 0) * 100;
  const contrib = [share(p => p.nw), Math.min(100, (me.k + me.a) / Math.max(1, meRadiant ? rs : ds) * 100), 20 + rnd() * 35, 2 + rnd() * 10, me.p >= 4 ? 30 + rnd() * 20 : 3 + rnd() * 8];
  const items = ITEMS.slice().sort(() => rnd() - .5).slice(0, 4).map((n, i) => ({ n, t: Math.round(m.dur * (0.22 + i * 0.16 + rnd() * 0.06)) })).sort((a, b) => a.t - b.t);

  const teamBlock = (name, list, cls) => `<div class="teams"><span class="team-name ${cls}" style="color:var(${cls === "rad" ? "--win" : "--loss"})">${name}${(cls === "rad") === radiantWin ? " · ПОБЕДА" : ""}</span>
    <div class="picks">${list.map(p => `<div class="pick${p.me ? " me" : ""}"><span class="pos">${p.p}</span>${hico(p.hero, p.hue, 40)}<span class="nm">${esc(p.hero)}</span><span class="s muted" style="font-size:10px">${p.k}/${p.d}/${p.a}</span></div>`).join("")}</div></div>`;
  const rows = (list) => list.map(p => `<tr class="${p.me ? "me" : ""}"><td>${esc(p.hero)} <span class="muted">${esc(p.name)}</span></td><td>${p.k}/${p.d}/${p.a}</td><td>${fmtK(p.nw)}</td><td>${p.gpm}</td><td>${p.xpm}</td><td>${fmtK(p.dmg)}</td></tr>`).join("");

  const sheet = $("#sheet");
  sheet.innerHTML = `<div class="wrap">
    <div class="sheet-top"><button class="back" id="back">← Назад</button><span class="muted" style="font-size:12px">Матч ${m.id} · ${ago(m.end)}</span></div>
    <div style="display:grid;gap:14px;padding-bottom:40px">
      <section class="card" style="justify-items:center;text-align:center">
        ${res(m.win)}
        <div class="score"><span class="rad">${rs}</span><span class="muted" style="font-size:16px">${fmtTime(m.dur)}</span><span class="dire">${ds}</span></div>
        <span class="muted" style="font-size:13px">${esc(m.hero)} · ${POS[m.pos]} (pos ${m.pos}) · ${m.ranked ? "рейтинг" : "обычная"} · All Pick</span>
      </section>
      <section class="card">${teamBlock("СИЛЫ СВЕТА", rad, "rad")}${teamBlock("СИЛЫ ТЬМЫ", dire, "dire")}</section>
      <section class="card"><div class="card-head"><h2>Преимущество по золоту</h2><span class="muted" style="font-size:12px">по минутам</span></div>${goldChart(gold)}</section>
      <div class="grid2">
        <section class="card"><div class="card-head"><h2>Вклад в игру</h2><span class="muted" style="font-size:12px">доля от команды</span></div>${radar(contrib)}</section>
        <section class="card"><div class="card-head"><h2>Тайминги предметов</h2></div>
          <div class="list">${items.map(it => `<div class="row"><span class="hico" style="background:var(--surface-2);color:var(--gold);text-shadow:none;font-size:10px">${esc(it.n.split(" ").map(w => w[0]).join(""))}</span><span class="grow"><span class="t">${esc(it.n)}</span><div class="bar" style="margin-top:6px"><i style="width:${it.t / m.dur * 100}%"></i></div></span><span class="end"><b>${fmtTime(it.t)}</b></span></div>`).join("")}</div>
          <span class="muted" style="font-size:12px">Полоска — момент покупки от начала до конца матча.</span>
        </section>
      </div>
      <section class="card"><div class="card-head"><h2>Все игроки</h2></div>
        <div class="table-scroll"><table>
          <thead><tr><th>Герой</th><th>K/D/A</th><th>NW</th><th>GPM</th><th>XPM</th><th>Урон</th></tr></thead>
          <tbody><tr class="team-sep"><td colspan="6" style="color:var(--win)">Силы Света</td></tr>${rows(rad)}
          <tr class="team-sep"><td colspan="6" style="color:var(--loss)">Силы Тьмы</td></tr>${rows(dire)}</tbody>
        </table></div>
      </section>
    </div></div>`;
  sheet.hidden = false; sheet.scrollTop = 0; document.body.style.overflow = "hidden";
  bindGold(gold);
  $("#back").addEventListener("click", closeMatch);
  tg?.BackButton?.show();
}
function closeMatch() {
  $("#sheet").hidden = true; document.body.style.overflow = ""; tg?.BackButton?.hide();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeMatch(); });

/* ---------- Telegram ---------- */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  tg.BackButton?.onClick(closeMatch);
  if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;   // тема Telegram
}

renderTabs(); render();
</script>
</body>
</html>
